<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprawlopolis Rehber</title>
    <style>
        :root { --primary: #0984e3; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-card { background: white; width: 100%; max-width: 400px; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #2d3436; text-align: center; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-direction: column; }
        input { padding: 12px; border: 2px solid #dfe6e9; border-radius: 10px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; }
        .card-info { background: #e1f5fe; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); }
        .card-info b { display: block; color: #0747a6; margin-bottom: 5px; }
        .target-box { background: #ffeaa7; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-card">
    <h1>🏗️ Sprawlopolis Rehber</h1>
    <div class="input-group">
        <input type="number" id="c1" placeholder="1. Kart No (1-18)">
        <input type="number" id="c2" placeholder="2. Kart No (1-18)">
        <input type="number" id="c3" placeholder="3. Kart No (1-18)">
        <button onclick="calculate()">Kuralları ve Hedefi Gör</button>
    </div>

    <div id="result"></div>
</div>

<script>
    const data = {
        1: {n: "Şehir Çeperi", d: "Kenarda bitmeyen yollar +1, bitenler -1 puan."},
        2: {n: "Çiçek Açımı", d: "Tam 3 Park içeren satır/sütunlar +1, hiç içermeyenler -1."},
        3: {n: "Doğaya Dön", d: "Her Park +1 puan; her Sanayi -3 puan."},
        4: {n: "Mahalle Şenliği", d: "4 farklı tip bloğun köşe köşeye geldiği her grup için puan."},
        5: {n: "Gökdelenler", d: "Sadece Ticari/Sanayi komşusu olan Sanayiler +2 puan."},
        6: {n: "Planlı Gelişim", d: "En büyük Konut grubu eksi en büyük Sanayi grubu boyutu."},
        7: {n: "Merkezi Parklar", d: "İç kısımdaki Parklar +1, kenardakiler -2 puan."},
        8: {n: "Varoşlar", d: "Her Konut grubu +1; en büyük Konut komşusu Parklar +2."},
        9: {n: "Beton Yığını", d: "Başka Sanayi ile kenar paylaşan her Sanayi +1 puan."},
        10: {n: "Ticaret Hattı", d: "Seçilen tek bir satır/sütundaki Ticari bloklar +1 puan."},
        11: {n: "Mini Marketler", d: "Yol üzerinde iki Konut arası Ticari bloklar +2 puan."},
        12: {n: "Otoban", d: "En uzun yoldaki her 2 bölüm için +1 puan."},
        13: {n: "Park Gezisi", d: "Parkta başlayıp Parkta biten her yol +3 puan."},
        14: {n: "Döngü Yolları", d: "Tamamlanmış döngü içindeki her yol bölümü +1 puan."},
        15: {n: "Arka Sokaklar", d: "2+ Sanayi komşusu olan Konutlar +2 puan."},
        16: {n: "Sabah Trafiği", d: "Hem Konut hem Ticari içinden geçen yollar +2 puan."},
        17: {n: "Turist Tuzakları", d: "Kenar Ticari +1, köşe Ticari +2 puan."},
        18: {n: "Dev Şehir", d: "En uzun satır + en uzun sütun blok sayısı toplamı."}
    };

    function calculate() {
        const ids = [document.getElementById('c1').value, document.getElementById('c2').value, document.getElementById('c3').value];
        let html = ""; let total = 0;
        ids.forEach(id => {
            if(data[id]) {
                html += `<div class="card-info"><b>${id}. ${data[id].n}</b>${data[id].d}</div>`;
                total += parseInt(id);
            }
        });
        if(html) {
            html += `<div class="target-box">TOPLAM HEDEF PUAN: ${total}</div>`;
            document.getElementById('result').innerHTML = html;
        }
    }
</script>
</body>
</html>
